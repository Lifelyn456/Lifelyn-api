name: API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: lifelyn
          POSTGRES_PASSWORD: development
          POSTGRES_DB: lifelyn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifelyn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lifelyn:development@localhost:5432/lifelyn
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@10.30.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm db:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
