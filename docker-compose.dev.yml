services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: lifelyn
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: lifelyn
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifelyn']
      interval: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: lifelyn-local
      MINIO_ROOT_PASSWORD: local-development-only
      MC_HOST_local: http://lifelyn-local:local-development-only@localhost:9000
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 lifelyn-local local-development-only
        mc mb --ignore-existing local/lifelyn-records
        mc anonymous set none local/lifelyn-records
volumes:
  postgres-data:
  redis-data:
  minio-data:
